name: aegis-recon

services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      args:
        # Pass a version into the image: AEGIS_VERSION=$(git describe --tags --always --dirty) docker compose up --build
        VERSION: ${AEGIS_VERSION:-dev}
    restart: unless-stopped
    # No host port: the API is reachable only inside the compose network.
    # The web container reverse-proxies /api to it. Single entry point = web.
    expose:
      - "8080"
    volumes:
      - aegis-data:/data
    healthcheck:
      test: ["CMD", "/aegisd", "-health"]
      interval: 10s
      timeout: 4s
      start_period: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  aegis-data:
