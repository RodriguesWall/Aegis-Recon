services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8080:8080"
    volumes:
      - aegis-data:/data

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  aegis-data:
